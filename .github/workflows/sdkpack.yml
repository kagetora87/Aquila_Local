name: sdkpack
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/sdkpack.yml']
jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Locate WindowsDesktop SDK
        shell: pwsh
        run: |
          $sdk = (dotnet --list-sdks | Select-String '^8\.' | Select-Object -Last 1).ToString().Split(' ')[0]
          Copy-Item -Recurse "C:\Program Files\dotnet\sdk\$sdk\Sdks\Microsoft.NET.Sdk.WindowsDesktop" wds
          Get-ChildItem -Recurse wds | Select-Object -First 40 FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windowsdesktop-sdk
          path: wds/
          retention-days: 3
